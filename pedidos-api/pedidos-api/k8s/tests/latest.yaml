apiVersion: v1
kind: Pod
metadata:
  name: test-latest
spec:
  containers:
    - name: nginx
      image: nginx:latest
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
      securityContext:
        runAsNonRoot: false

