apiVersion: v1
kind: Pod
metadata:
  name: falco-test
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
      resources:
        requests:
          cpu: "100m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "64Mi"