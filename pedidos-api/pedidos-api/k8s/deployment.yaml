apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos-api
spec:
  replicas: 1
  # H2: one writer, including during updates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pedidos-api
      version: v1
  template:
    metadata:
      labels:
        app: pedidos-api
        version: v1
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pedidos
          image: pedidos-api:l4-01
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
          envFrom:
            - configMapRef:
                name: pedidos-config
          env:
            - name: API_TITLE
              valueFrom:
                configMapKeyRef:
                  name: pedidos-config
                  key: api_title
          volumeMounts:
            - name: pedidos-h2-storage
              mountPath: /data
      volumes:
        - name: pedidos-h2-storage
          persistentVolumeClaim:
            claimName: pedidos-h2-pvc