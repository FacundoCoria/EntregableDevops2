
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pedidos-api
      version: v1
  template:
    metadata:
      labels:
        app: pedidos-api
        version: v1
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: pedidos
          image: facundocoria/pedidos-api:1.0
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "25m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          env:
            - name: API_TITLE
              valueFrom:
                configMapKeyRef:
                  name: pedidos-config
                  key: api_title
          volumeMounts:
            - name: pedidos-h2-storage
              mountPath: /data
      volumes:
        - name: pedidos-h2-storage
          persistentVolumeClaim:
            claimName: pedidos-h2-pvc
