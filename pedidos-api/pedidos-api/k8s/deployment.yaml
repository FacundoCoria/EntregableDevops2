
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos-api
spec:
  replicas: 1

  selector:
    matchLabels:
      app: pedidos-api
      version: v1

  template:
    metadata:
      labels:
        app: pedidos-api
        version: v1

    spec:
      containers:
        - name: pedidos
          image: pedidos-api:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          env:
            - name: API_TITLE
              valueFrom:
                configMapKeyRef:
                  name: pedidos-config
                  key: api_title

          # Monta el almacenamiento persistente dentro del contenedor
          volumeMounts:
            - name: pedidos-h2-storage
              mountPath: /data

      # Define el volumen persistente de Kubernetes
      volumes:
        - name: pedidos-h2-storage
          persistentVolumeClaim:
            claimName: pedidos-h2-pvc
