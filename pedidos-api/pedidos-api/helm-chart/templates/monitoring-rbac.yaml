apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pedidos.base" . }}-prometheus
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ include "pedidos.base" . }}-node-metrics
rules:
  - apiGroups: [""]
    resources: [nodes/proxy]
    resourceNames: [{{ .Values.observability.nodeName | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "pedidos.base" . }}-node-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ include "pedidos.base" . }}-node-metrics
subjects:
  - kind: ServiceAccount
    name: {{ include "pedidos.base" . }}-prometheus
    namespace: {{ .Release.Namespace }}
