apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: l4-deny-latest-images
spec:
  validationActions:
  - Deny
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  autogen:
    validatingAdmissionPolicy:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: laboratorio4
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: '(object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers
      : [])).all(c, c.image.contains(''@sha256:'') || (c.image.split(''/'')[c.image.split(''/'').size()-1].contains('':'')
      && !c.image.endsWith('':latest'')))'
    message: Imagenes con etiqueta explicita distinta de latest o digest SHA256.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: l4-require-container-resources
spec:
  validationActions:
  - Deny
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  autogen:
    validatingAdmissionPolicy:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: laboratorio4
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: '(object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers
      : [])).all(c, has(c.resources) && has(c.resources.requests) && has(c.resources.limits)
      && [''cpu'',''memory''].all(k, k in c.resources.requests && k in c.resources.limits))'
    message: Cada contenedor requiere requests y limits de CPU y memoria.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: l4-disallow-root-containers
spec:
  validationActions:
  - Deny
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  autogen:
    validatingAdmissionPolicy:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: laboratorio4
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: '(object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers
      : [])).all(c, (has(c.securityContext) && has(c.securityContext.runAsNonRoot)
      ? c.securityContext.runAsNonRoot : (has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot)
      && object.spec.securityContext.runAsNonRoot)) && (has(c.securityContext) &&
      has(c.securityContext.runAsUser) ? c.securityContext.runAsUser != 0 : (!has(object.spec.securityContext)
      || !has(object.spec.securityContext.runAsUser) || object.spec.securityContext.runAsUser
      != 0)))'
    message: runAsNonRoot efectivo debe ser true y runAsUser no puede ser 0.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: l4-disallow-privileged-containers
spec:
  validationActions:
  - Deny
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  autogen:
    validatingAdmissionPolicy:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: laboratorio4
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: '(object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers
      : [])).all(c, !has(c.securityContext) || !has(c.securityContext.privileged)
      || !c.securityContext.privileged)'
    message: No se permiten contenedores privilegiados.
