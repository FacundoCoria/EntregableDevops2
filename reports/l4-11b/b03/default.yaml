---
# Source: pedidos/templates/monitoring-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: l4-b03-check-pedidos-prometheus
automountServiceAccountToken: false

---
# Source: pedidos/templates/configmaps.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: l4-b03-check-pedidos-api
data:
  SERVER_PORT: "8080"
  API_TITLE: "Pedidos - Laboratorio 4"
  SPRING_PROFILES_ACTIVE: "lab"
  SPRING_DATASOURCE_URL: "jdbc:h2:file:/data/pedidos"
  SPRING_H2_CONSOLE_ENABLED: "false"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

---
# Source: pedidos/templates/configmaps.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: l4-b03-check-pedidos-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: pedidos-api
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["l4-b03-check-pedidos-api:8080"]
            labels:
              namespace: "laboratorio4"
              release: "l4-b03-check"
      - job_name: kubelet-resource
        scheme: https
        metrics_path: /api/v1/nodes/minikube/proxy/metrics/resource
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        static_configs:
          - targets: ["kubernetes.default.svc:443"]
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'pod_cpu_usage_seconds_total|pod_memory_working_set_bytes'
            action: keep
          - source_labels: [namespace, pod]
            regex: 'laboratorio4;l4-b03-check-pedidos-.*'
            action: keep

---
# Source: pedidos/templates/configmaps.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: l4-b03-check-pedidos-grafana-provisioning
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus L4
        uid: l4-prometheus
        type: prometheus
        access: proxy
        url: http://l4-b03-check-pedidos-prometheus:9090
        isDefault: true
        editable: false
        version: 1
        jsonData:
          httpMethod: POST
          timeInterval: 5s
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: laboratorio4
        orgId: 1
        folder: Laboratorio 4
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 10
        options:
          path: /etc/grafana/l4-dashboards

