apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: l4-deny-latest-images
spec:
  validationActions:
  - Deny
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  autogen:
    validatingAdmissionPolicy:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - kube-system
        - kube-public
        - kube-node-lease
        - kyverno
        - falco
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: '(object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers
      : [])).all(c, !c.image.split(''@'')[0].endsWith('':latest'') &&

      (c.image.matches(''^[^@]+@sha256:[a-fA-F0-9]{64}$'') ||

      (!c.image.contains(''@'') && c.image.split(''/'')[c.image.split(''/'').size()-1].contains('':''))))'
    message: Se requiere tag explicito distinto de latest o digest SHA256 valido;
      latest@digest tambien se rechaza.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: l4-require-container-resources
spec:
  validationActions:
  - Deny
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  autogen:
    validatingAdmissionPolicy:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - kube-system
        - kube-public
        - kube-node-lease
        - kyverno
        - falco
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: '(object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers
      : [])).all(c, has(c.resources) && has(c.resources.requests) && has(c.resources.limits)
      && [''cpu'',''memory''].all(k, k in c.resources.requests && k in c.resources.limits))'
    message: Cada contenedor requiere requests y limits de CPU y memoria.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: l4-disallow-root-containers
spec:
  validationActions:
  - Deny
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  autogen:
    validatingAdmissionPolicy:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - kube-system
        - kube-public
        - kube-node-lease
        - kyverno
        - falco
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: '(object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers
      : [])).all(c, (has(c.securityContext) && has(c.securityContext.runAsNonRoot)
      ? c.securityContext.runAsNonRoot : (has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot)
      && object.spec.securityContext.runAsNonRoot)) && (has(c.securityContext) &&
      has(c.securityContext.runAsUser) ? c.securityContext.runAsUser != 0 : (!has(object.spec.securityContext)
      || !has(object.spec.securityContext.runAsUser) || object.spec.securityContext.runAsUser
      != 0)))'
    message: runAsNonRoot efectivo debe ser true y runAsUser no puede ser 0.
---
